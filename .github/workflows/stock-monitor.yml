name: Stock Price Monitor (Hourly)

on:
  schedule:
    - cron: "0 * * * *"   # har 1 hour run hoga
  workflow_dispatch:      # manually run karne ka option

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # GitHub repo ka code runner machine par laata hai

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        # Python install karta hai

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance python-dotenv
        # Required Python libraries install hoti hain

      - name: Run stock price script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          python stockpriceScript.py
        # 👆 YAHAN SCRIPT KA NAAM
